# Weekly check that the node still matches the live Raziel calculator API.
# Fails (and GitHub emails the repo admins) when a calculator was added or an
# input changed, so the node can be regenerated with `npm run generate`.
name: API sync

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node scripts/generate.mjs
      - name: Fail if the generated node changed
        run: git diff --exit-code -- nodes test/fixtures
